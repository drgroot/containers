name: build-docker

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - actions-templater
          - backup-pvc
          - coder-spark
          - narr-trigger
          - runner-spark
          - runner

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - id: changes
        name: Filter changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - '${{ matrix.package }}/**'

      # Pull credentials only for builds that can publish. PRs get harmless
      # local defaults, so untrusted code never receives repository secrets.
      - id: docker_secrets
        name: Read Docker credentials from Vault
        if: >-
          (steps.changes.outputs.src == 'true' && github.ref == 'refs/heads/main') ||
          startsWith(github.ref, format('refs/tags/{0}-', matrix.package))
        uses: hashicorp/vault-action@v2
        with:
          method: token
          token: ${{ secrets.VAULT_TOKEN }}
          url: ${{ secrets.VAULT_ADDR }}
          secrets: |
            vendor/data/docker public-host | PUBLIC_HOST ;
            vendor/data/docker public-username | PUBLIC_USERNAME ;
            vendor/data/docker public-password | PUBLIC_PASSWORD ;

      - id: metadata
        name: Set image metadata
        env:
          VAULT_REGISTRY: ${{ steps.docker_secrets.outputs.PUBLIC_HOST }}
          VAULT_USERNAME: ${{ steps.docker_secrets.outputs.PUBLIC_USERNAME }}
          REF_NAME: ${{ github.ref_name }}
          PACKAGE: ${{ matrix.package }}
          PUBLISH: ${{ (steps.changes.outputs.src == 'true' && github.ref == 'refs/heads/main') || startsWith(github.ref, format('refs/tags/{0}-', matrix.package)) }}
        run: |
          set -euo pipefail

          # These values are intentionally non-routable and are used only for
          # pull requests and other non-publishing builds.
          registry="localhost"
          username="dummy"
          version="pr-${GITHUB_RUN_NUMBER}"

          if [[ "$PUBLISH" == "true" ]]; then
            # Vault may store the registry as a URL, while Docker image
            # references require only the host (and optional port).
            registry="${VAULT_REGISTRY#*://}"
            registry="${registry%/}"
            username="${VAULT_USERNAME#/}"
            username="${username%/}"

            # Keep the image reference predictable even if the secret was
            # entered with whitespace or uppercase characters.
            registry="$(printf '%s' "$registry" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            username="$(printf '%s' "$username" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

            if [[ -z "$registry" || -z "$username" || "$registry" == */* || "$username" == */* ]]; then
              echo "Vault returned an invalid registry host or username"
              exit 1
            fi
          fi

          if [[ "$REF_NAME" == "main" ]]; then
            version="latest"
          elif [[ "$REF_NAME" == "$PACKAGE-"* ]]; then
            version="${REF_NAME#"$PACKAGE-"}"
          fi

          image="${registry}/${username}/${PACKAGE}"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "username=${username}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_REF}"
          echo "changed=${{ steps.changes.outputs.src }}"
          echo "publish=${PUBLISH}"
          echo "image=${image}:${version}"

      - name: Log in to Docker registry
        if: steps.metadata.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.metadata.outputs.registry }}
          username: ${{ steps.docker_secrets.outputs.PUBLIC_USERNAME }}
          password: ${{ steps.docker_secrets.outputs.PUBLIC_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.src == 'true' || startsWith(github.ref, format('refs/tags/{0}-', matrix.package))
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push image
        if: steps.changes.outputs.src == 'true' || startsWith(github.ref, format('refs/tags/{0}-', matrix.package))
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.package }}
          file: ${{ matrix.package }}/Dockerfile
          push: ${{ steps.metadata.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
